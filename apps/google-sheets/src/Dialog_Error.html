<!DOCTYPE html>
<html>
<head>
  <base target="_top">

  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;

      --text: #0f172a;
      --text-secondary: #64748b;

      --border: #e2e8f0;

      --primary: #4f46e5;

      --success: #16a34a;
      --success-soft: #ecfdf5;
    }


    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;

      background: var(--bg);

      color: var(--text);

      font-family:
        Inter,
        Arial,
        sans-serif;
    }


    body {
      padding: 20px;
    }


    .card {
      overflow: hidden;

      background: var(--surface);

      border:
        1px solid var(--border);

      border-radius: 18px;

      box-shadow:
        0 18px 45px
        rgba(15, 23, 42, 0.12);
    }


    .header {
      display: flex;

      gap: 14px;

      align-items: center;

      padding: 20px 22px;

      background:
        linear-gradient(
          135deg,
          var(--success-soft),
          #ffffff
        );

      border-bottom:
        1px solid #f1f5f9;
    }


    .icon {
      display: flex;

      width: 46px;
      height: 46px;

      align-items: center;
      justify-content: center;

      border-radius: 14px;

      background: #dcfce7;

      color: var(--success);

      font-size: 22px;

      font-weight: 800;
    }


    .title {
      margin: 0 0 4px;

      font-size: 20px;

      font-weight: 750;
    }


    .subtitle {
      margin: 0;

      color:
        var(--text-secondary);

      font-size: 12px;
    }


    .content {
      padding: 18px 22px;
    }


    .summary {
      padding: 14px 16px;

      background: #f8fafc;

      border:
        1px solid var(--border);

      border-radius: 12px;

      color: #1e293b;

      font-size: 13px;

      line-height: 1.6;
    }


    .detail {
      margin-top: 13px;

      color:
        var(--text-secondary);

      font-size: 12px;

      line-height: 1.6;
    }


    .footer {
      display: flex;

      justify-content: flex-end;

      padding:
        0 22px 20px;
    }


    button {
      min-width: 90px;

      padding:
        10px 16px;

      border: 0;

      border-radius: 10px;

      background:
        var(--primary);

      color: #ffffff;

      cursor: pointer;

      font-size: 12px;

      font-weight: 700;
    }
  </style>
</head>


<body>

<div class="card">

  <div class="header">

    <div class="icon">
      ✓
    </div>


    <div>

      <h1 class="title">
        <?= title ?>
      </h1>


      <p class="subtitle">
        Smart Task Manager
      </p>

    </div>

  </div>


  <div class="content">

    <div class="summary">
      <?= summary ?>
    </div>


    <? if (detail) { ?>

      <div class="detail">
        <?= detail ?>
      </div>

    <? } ?>

  </div>


  <div class="footer">

    <button
      onclick="google.script.host.close()"
    >
      Done
    </button>

  </div>

</div>

</body>
</html>
