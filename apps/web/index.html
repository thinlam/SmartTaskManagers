<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover is required for env(safe-area-inset-*) to report
      real, non-zero values inside the Capacitor Android/iOS shells
      (Phase 34) — without it every safe-area CSS variable resolves to 0
      and content draws straight under the notch/punch-hole camera,
      status bar, and gesture nav bar. Harmless in a normal desktop/
      mobile browser (no notch there, insets stay 0 either way).
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Smart Task Manager</title>
    <script>
      try {
        if (localStorage.getItem('stm.theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
