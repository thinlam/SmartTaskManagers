workflows:
  android-build:
    name: Smart Task Manager - Android
    max_build_duration: 60
    instance_type: linux
    environment:
      node: 20
      vars:
        PROJECT_ROOT: apps/web
    scripts:
      - name: Install root dependencies
        script: |
          npm install
      - name: Build web assets + sync Capacitor
        script: |
          cd $PROJECT_ROOT
          npm run cap:sync
      - name: Build Android debug APK
        script: |
          cd $PROJECT_ROOT/android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - apps/web/android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - thinlam6@gmail.com
        notify:
          success: true
          failure: true

  ios-build:
    name: Smart Task Manager - iOS
    max_build_duration: 60
    instance_type: mac_mini
    integrations:
      app_store_connect: codemagic_api_key # tạo trong Codemagic > Teams > Integrations > App Store Connect
    environment:
      node: 20
      vars:
        PROJECT_ROOT: apps/web
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
        BUNDLE_ID: com.smarttaskmanager.app
      ios_signing:
        distribution_type: ad_hoc # đổi thành app_store nếu muốn nộp qua TestFlight
        bundle_identifier: com.smarttaskmanager.app
    scripts:
      - name: Install root dependencies
        script: |
          npm install
      - name: Build web assets + sync Capacitor
        script: |
          cd $PROJECT_ROOT
          npm run cap:sync
      - name: Install CocoaPods
        script: |
          cd $PROJECT_ROOT/ios/App
          pod install
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_ADHOC \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build ipa
        script: |
          cd $PROJECT_ROOT
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - thinlam6@gmail.com
        notify:
          success: true
          failure: true
